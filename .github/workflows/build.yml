name: Build KoboRoot.tgz
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build with nickeltc
        run: |
          docker run --volume="$PWD:$PWD" --workdir="$PWD" --entrypoint=make --rm ghcr.io/pgaskin/nickeltc:1.0 clean
          docker run --volume="$PWD:$PWD" --workdir="$PWD" --entrypoint=make --rm ghcr.io/pgaskin/nickeltc:1.0 all koboroot
          sudo chown -R "$(id -u):$(id -g)" .
      - uses: actions/upload-artifact@v4
        with:
          name: KoboRoot
          path: KoboRoot.tgz
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/.*#define ADDON_VERSION "\(.*\)".*/\1/p' src/common.h | head -n1)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" KoboRoot.tgz \
              --target "$GITHUB_SHA" \
              --title "Kobo Tweaks $TAG" \
              --generate-notes
          fi
